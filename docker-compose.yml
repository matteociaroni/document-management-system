services:

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY}
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    depends_on:
      opensearch:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  email_poller:
    build: ./email_poller
    container_name: email_poller
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY}

  mcp_server:
    build: ./mcp_server
    container_name: mcp_server
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL}

  agent_worker:
    build: ./agent_worker
    container_name: agent_worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME}
      MODEL_NAME: ${MODEL_NAME}
      BASE_URL: ${BASE_URL}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY}
      MCP_SERVER_URL: ${MCP_SERVER_URL}
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    depends_on:
      mcp_server:
        condition: service_started
      tika:
        condition: service_started
      opensearch:
        condition: service_healthy

  tika:
    image: apache/tika:latest
    container_name: tika_server
    ports:
      - "9998:9998"
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MyStr0ng!Pass
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy

  # adminer:
  #   image: adminer
  #   container_name: adminer
  #   restart: always
  #   ports:
  #     - "8081:8080"
  #   depends_on:
  #     - postgres

volumes:
  opensearch_data:
