services:
  master:
    image: chrislusf/seaweedfs
    container_name: sw_master
    ports:
      - "9333:9333"
    command: "master -ip=master"

  volume:
    image: chrislusf/seaweedfs
    container_name: sw_volume
    ports:
      - "8080:8080"
    command: "volume -mserver=master:9333 -port=8080"
    depends_on:
      - master

  filer:
    image: chrislusf/seaweedfs
    container_name: sw_filer
    ports:
      - "8888:8888"
    command: "filer -master=master:9333"
    depends_on:
      - master
      - volume

  s3:
    image: chrislusf/seaweedfs
    container_name: sw_s3
    ports:
      - "8333:8333"
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json # Monta il file
    command: 's3 -filer="filer:8888" -ip.bind=0.0.0.0 -config="/etc/seaweedfs/s3.json"'
    depends_on:
      - filer

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always

    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: dms

    ports:
      - "5432:5432"

volumes:
 - postgres_data:/var/lib/postgresql/data
 - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
