services:
  master:
    image: chrislusf/seaweedfs
    container_name: sw_master
    ports:
      - "9333:9333"
    command: "master -ip=master"

  volume:
    image: chrislusf/seaweedfs
    container_name: sw_volume
    ports:
      - "8080:8080"
    command: "volume -mserver=master:9333 -port=8080"
    depends_on:
      - master

  filer:
    image: chrislusf/seaweedfs
    container_name: sw_filer
    ports:
      - "8888:8888"
    command: "filer -master=master:9333"
    depends_on:
      - master
      - volume

  s3:
    image: chrislusf/seaweedfs
    container_name: sw_s3
    ports:
      - "8333:8333"
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json
    command: 's3 -filer="filer:8888" -ip.bind=0.0.0.0 -config="/etc/seaweedfs/s3.json"'
    depends_on:
      - filer

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  email_poller:
    build: ./email_poller
    container_name: email_poller
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

  mcp_server:
    build: ./mcp_server
    container_name: mcp_server
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  agent_worker:
    build: ./agent_worker
    container_name: agent_worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MODEL_NAME: ${MODEL_NAME}
      BASE_URL: ${BASE_URL}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY}
      MCP_SERVER_URL: ${MCP_SERVER_URL}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
      mcp_server:
        condition: service_started
      tika:
        condition: service_started

  tika:
    image: apache/tika:latest
    container_name: tika_server
    ports:
      - "9998:9998"

  # adminer:
  #   image: adminer
  #   container_name: adminer
  #   restart: always
  #   ports:
  #     - "8081:8080"
  #   depends_on:
  #     - postgres

volumes:
  postgres_data:
