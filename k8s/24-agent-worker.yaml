apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-worker
  template:
    metadata:
      labels:
        app: agent-worker
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo waiting postgres; sleep 2; done
              until nc -z opensearch 9200; do echo waiting opensearch; sleep 2; done
              until nc -z mcp-server 8001; do echo waiting mcp; sleep 2; done
              until nc -z tika 9998; do echo waiting tika; sleep 2; done
      containers:
        - name: agent-worker
          image: REGISTRY/dms-agent-worker:TAG  # da sostituire
          envFrom:
            - configMapRef: { name: dms-config }
            - secretRef: { name: dms-secrets }
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits: { cpu: "2000m", memory: "2Gi" }
