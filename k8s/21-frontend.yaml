# VITE_API_URL is a build-time arg baked into the frontend image, not a runtime
# env. Rebuild the image whenever the public API URL changes:
#   docker build --build-arg VITE_API_URL=https://api.example.com -t REGISTRY/dms-frontend:TAG ./frontend
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dms
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dms
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: dms
    spec:
      containers:
        - name: frontend
          image: ghcr.io/matteociaroni/dms-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
