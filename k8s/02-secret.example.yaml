# NON committare la versione reale di questo file.
# Copia in 02-secret.yaml, sostituisci i valori, poi: kubectl apply -f 02-secret.yaml
# Oppure crealo via CLI:
#   kubectl -n dms create secret generic dms-secrets \
#     --from-literal=POSTGRES_USER=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=POSTGRES_DB=dms \
#     --from-literal=S3_ACCESS_KEY=... \
#     --from-literal=S3_SECRET_KEY=... \
#     --from-literal=EMAIL_ENCRYPTION_KEY=... \
#     --from-literal=CUSTOM_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: dms-secrets
  namespace: dms
type: Opaque
stringData:
  POSTGRES_USER: "myuser"
  POSTGRES_PASSWORD: "mypassword"
  POSTGRES_DB: "dms"
  S3_ACCESS_KEY: "mykey"
  S3_SECRET_KEY: "mysecret"
  EMAIL_ENCRYPTION_KEY: "mykey"
  CUSTOM_API_KEY: "mykey"
