# Template only. Copy to secret.yaml, fill in real values, and DO NOT commit.
# Apply with: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: dms-secrets
  namespace: dms
type: Opaque
stringData:
  # Cloud SQL (Postgres) — full SQLAlchemy URL with sslmode.
  DATABASE_URL: "postgresql://USER:PASSWORD@CLOUDSQL_HOST:5432/dms?sslmode=require"

  # GCS HMAC keys (S3-compatible).
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"

  # Fernet key — generate with:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  EMAIL_ENCRYPTION_KEY: "REPLACE_ME"

  # LLM proxy API key.
  CUSTOM_API_KEY: "REPLACE_ME"
