# Sostituisci dms.example.com con il tuo dominio reale.
# Stesso hostname per frontend (/) e backend (/api), così niente CORS.
# Il backend deve servire le rotte sotto /api (oppure aggiungi uno strip-prefix middleware di Traefik).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dms
  namespace: dms
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dms.example.com
      secretName: dms-tls
  rules:
    - host: dms.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
