apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: dms
spec:
  selector:
    app: seaweedfs-s3
  ports:
    - port: 8333
      targetPort: 8333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-s3
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-s3
  template:
    metadata:
      labels:
        app: seaweedfs-s3
    spec:
      containers:
        - name: s3
          image: chrislusf/seaweedfs:latest
          args:
            - "s3"
            - "-filer=seaweedfs-filer:8888"
            - "-ip.bind=0.0.0.0"
            - "-config=/etc/seaweedfs/s3.json"
          ports:
            - containerPort: 8333
          volumeMounts:
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: s3-config
          configMap:
            name: seaweedfs-s3-config
