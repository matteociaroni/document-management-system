# NB: VITE_API_URL è build-time. Builda l'immagine con:
#   docker build --build-arg VITE_API_URL=https://<tuo-dominio>/api -t REGISTRY/dms-frontend:TAG ./frontend
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dms
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: REGISTRY/dms-frontend:TAG  # da sostituire
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
