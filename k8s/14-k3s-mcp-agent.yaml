apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-mcp-agent
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k3s-mcp-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k3s-mcp-agent
        app.kubernetes.io/part-of: dms
    spec:
      containers:
        - name: k3s-mcp-agent
          image: ghcr.io/matteociaroni/dms-k3s_mcp_agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: webhook
            - containerPort: 8001
              name: mcp
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: k3s-mcp-agent
  namespace: dms
spec:
  selector:
    app.kubernetes.io/name: k3s-mcp-agent
  ports:
    - name: webhook
      port: 8000
      targetPort: 8000
    - name: mcp
      port: 8001
      targetPort: 8001
