apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dms
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting postgres; sleep 2; done"]
        - name: wait-opensearch
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z opensearch 9200; do echo waiting opensearch; sleep 2; done"]
      containers:
        - name: backend
          image: REGISTRY/dms-backend:TAG  # da sostituire
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: dms-config }
            - secretRef: { name: dms-secrets }
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          readinessProbe:
            httpGet: { path: /docs, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits: { cpu: "2000m", memory: "2Gi" }
