apiVersion: v1
kind: Namespace
metadata:
  name: dms
  labels:
    app.kubernetes.io/part-of: dms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-config
  namespace: dms
data:
  S3_ENDPOINT: "https://storage.googleapis.com"
  GCP_BUCKET_NAME: "idms-bucket"
  MCP_SERVER_URL: "http://mcp-server:8001/sse"
  OPENSEARCH_URL: "http://opensearch:9200"
  MODEL_NAME: "gemini-2.5-pro"
  BASE_URL: "https://litellm-proxy-1013932759942.europe-west8.run.app"
  EMBEDDING_MODEL_NAME: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
---
# OpenSearch (StatefulSet + headless Service)
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: dms
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: dms
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/part-of: dms
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.18.0
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: "single-node"
            - name: plugins.security.disabled
              value: "true"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              value: "MyStr0ng!Pass"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              memory: "1500Mi"
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
        # storageClassName non impostato: su k3s usa local-path di default.
---
# Tika
apiVersion: v1
kind: Service
metadata:
  name: tika
  namespace: dms
spec:
  selector:
    app.kubernetes.io/name: tika
  ports:
    - name: http
      port: 9998
      targetPort: 9998
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tika
        app.kubernetes.io/part-of: dms
    spec:
      containers:
        - name: tika
          image: apache/tika:latest
          ports:
            - containerPort: 9998
          readinessProbe:
            tcpSocket:
              port: 9998
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
---
# MCP server
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: dms
spec:
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/part-of: dms
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/matteociaroni/dms-mcp_server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: DATABASE_URL
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
---
# Backend (FastAPI)
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dms
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dms
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: dms
    spec:
      containers:
        - name: backend
          image: ghcr.io/matteociaroni/dms-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          #readinessProbe:
           # httpGet:
            #  path: /health
             # port: 8000
            #initialDelaySeconds: 10
            #periodSeconds: 10
          #livenessProbe:
           # httpGet:
            #  path: /health
             # port: 8000
           # initialDelaySeconds: 30
            #periodSeconds: 30
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
---
# Frontend (VITE_API_URL e' un build-arg, rebuild dell'immagine se cambia)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dms
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dms
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: dms
    spec:
      containers:
        - name: frontend
          image: ghcr.io/matteociaroni/dms-frontend:latest
          imagePullPolicy: Always
          env:
            - name: VITE_API_URL
              value: "https://api.dms.matteociaroni.it"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
---
# Email poller (singolo worker, niente rolling update)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-poller
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: email-poller
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: email-poller
        app.kubernetes.io/part-of: dms
    spec:
      containers:
        - name: email-poller
          image: ghcr.io/matteociaroni/dms-email_poller:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
# Agent worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-worker
        app.kubernetes.io/part-of: dms
    spec:
      containers:
        - name: agent-worker
          image: ghcr.io/matteociaroni/dms-agent_worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          resources:
            requests:
              cpu: "300m"
              memory: "1Gi"
            limits:
              memory: "2Gi"
---
# Ingress (Traefik di k3s). Sostituire gli host con i domini reali.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dms-frontend
  namespace: dms
spec:
  rules:
    - host: dms.matteociaroni.it
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dms-backend
  namespace: dms
spec:
  rules:
    - host: api.dms.matteociaroni.it
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000

---
# K3s MCP Agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-mcp-agent
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k3s-mcp-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k3s-mcp-agent
        app.kubernetes.io/part-of: dms
    spec:
      containers:
        - name: k3s-mcp-agent
          image: ghcr.io/matteociaroni/dms-k3s_mcp_agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: webhook
            - containerPort: 8001
              name: mcp
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: k3s-mcp-agent
  namespace: dms
spec:
  selector:
    app.kubernetes.io/name: k3s-mcp-agent
  ports:
    - name: webhook
      port: 8000
      targetPort: 8000
    - name: mcp
      port: 8001
      targetPort: 8001

---
# Fluent Bit (K3s Log Aggregation)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: dms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - events
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: dms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: dms
  labels:
    app.kubernetes.io/name: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    @INCLUDE input-kubernetes.conf
    @INCLUDE filter-kubernetes.conf
    @INCLUDE output-webhook.conf

  input-kubernetes.conf: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            docker
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [INPUT]
        Name            kubernetes_events
        Tag             kube_events
        DB              /var/log/flb_kube_events.db
        Kube_URL        https://kubernetes.default.svc:443
        Kube_CA_File    /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File /var/run/secrets/kubernetes.io/serviceaccount/token

  filter-kubernetes.conf: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

    [FILTER]
        Name    grep
        Match   kube.*
        # Only forward logs containing "error" or "warn" or "panic" or "fatal" (case insensitive)
        Regex   log (?i).*(error|warn|panic|fatal).*

  output-webhook.conf: |
    [OUTPUT]
        Name          http
        Match         kube.*
        Host          k3s-mcp-agent.dms.svc.cluster.local
        Port          8000
        URI           /logs
        Format        json
        Retry_Limit   3

    [OUTPUT]
        Name          http
        Match         kube_events
        Host          k3s-mcp-agent.dms.svc.cluster.local
        Port          8000
        URI           /logs
        Format        json
        Retry_Limit   3

  parsers.conf: |
    [PARSER]
        Name   json
        Format json
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: dms
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.0.4
          imagePullPolicy: Always
          ports:
            - containerPort: 2020
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-config
